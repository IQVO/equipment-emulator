openapi: 3.0.3
info:
  title: Equipment Emulator Admin API
  version: 1.0.0
  description: |
    The admin API of the WCS equipment emulator, test infrastructure that stands in
    for ISA-95 levels 1 and 0: AMR robots speaking VDA 5050 v3 and an AS/RS PLC
    speaking telegram protocol v1, both over MQTT. This REST API only inspects the
    simulated world, injects faults and seeds stock; it never carries robot or PLC
    traffic and never calls a sibling context.

    Fault injection is idempotent by construction: a fault is switched on or off
    with `active`, so repeating a request converges to the same state.

    Every POST accepts the fleet `Idempotency-Key` header (ADR 0006). It is
    OPTIONAL here, unlike the rest of the fleet: without it a POST simply runs;
    with it a retry under the same key is answered from the store by the replay
    class of the first answer. Keys live in process memory for 24 hours and are
    lost when the emulator restarts (the emulator has no database, ADR 0001).

    `GET /robots` pages with `limit` and an opaque keyset `cursor` and answers
    `{items, nextCursor}`.

    Errors are RFC 7807 problem documents served as `application/problem+json`;
    `code` is the stable problem slug. There is no authentication layer (fleet
    decision 2026-09-11).
  contact:
    name: equipment-emulator maintainers
    url: https://github.com/IQVO/equipment-emulator
  license:
    name: UNLICENSED
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Robots
    description: Inspection of the simulated AMR robots.
  - name: Asrs
    description: Inspection and seeding of the simulated AS/RS.
  - name: Faults
    description: Fault injection into robots and the AS/RS.
  - name: Health
    description: Liveness and readiness probes.

paths:
  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe
      description: 200 while the process is running.
      tags: [Health]
      responses:
        "200":
          description: Alive.
  /readyz:
    get:
      operationId: readyz
      summary: Readiness probe
      description: 200 when the robot gateway and every AS/RS gateway are connected to the MQTT broker, 503 otherwise.
      tags: [Health]
      responses:
        "200":
          description: Ready.
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /robots:
    get:
      operationId: listRobots
      summary: List the simulated robots
      description: |
        Returns one page of robot snapshots, ordered by serial number. Follow
        `nextCursor` until it is absent. A query parameter other than `limit` and
        `cursor` is 400 `unknown-query-parameter`.
      tags: [Robots]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of robots.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RobotPage"
        "400":
          $ref: "#/components/responses/BadRequest"
  /asrs/{asrsId}:
    get:
      operationId: getAsrs
      summary: Get an AS/RS snapshot
      description: Returns the stored containers, the port contents and the state of each aisle unit of one AS/RS.
      tags: [Asrs]
      parameters:
        - $ref: "#/components/parameters/AsrsId"
      responses:
        "200":
          description: The AS/RS view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsrsView"
        "404":
          $ref: "#/components/responses/NotFound"
  /faults:
    post:
      operationId: injectFault
      summary: Switch a fault on or off
      description: |
        Switches a fault on (`active` true) or off. `ROBOT_BLOCKED`, `ROBOT_BATTERY`
        and `ROBOT_DISCONNECT` target a robot serial number; `ASRS_UNIT` (with
        `aisle`) and `ASRS_NO_READ` (with `port`) target an AS/RS id. `value` is the
        state of charge for `ROBOT_BATTERY`. `ASRS_NO_READ` applies only to an
        OUTPUT port (only a RETRIEVE's arrival is read); naming an INPUT port is a
        409 `WRONG_PORT_KIND`, an unknown port a 409 `UNKNOWN_PORT`.
      tags: [Faults]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Fault"
      responses:
        "204":
          description: The fault was applied.
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /asrs/{asrsId}/seeds:
    post:
      operationId: seedContainer
      summary: Seed a container into a storage position
      description: Places a container directly into a storage position, bypassing the PLC; used to prepare a scenario.
      tags: [Asrs]
      parameters:
        - $ref: "#/components/parameters/AsrsId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Seed"
      responses:
        "204":
          description: The container was stored.
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /asrs/{asrsId}/ports/{portId}/container:
    post:
      operationId: placeContainerAtPort
      summary: Place a container at a port
      description: Puts a container on a port as if an operator had delivered it; 409 with the reject reason when the port is occupied or unknown.
      tags: [Asrs]
      parameters:
        - $ref: "#/components/parameters/AsrsId"
        - name: portId
          in: path
          required: true
          description: The port identifier.
          schema: { type: string }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortContainer"
      responses:
        "204":
          description: The container is at the port.
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

components:
  headers:
    IdempotencyReplayed:
      description: >-
        "true" when this response is the stored answer of an earlier request
        carrying the same Idempotency-Key (the handler did not run again).
        Absent on the first execution and on a request without a key.
      schema:
        type: string
        enum: ["true"]
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Optional (ADR 0006): 1-128 printable ASCII characters, a client-generated
        UUID per logical request (a retry reuses it). Without it the request runs
        unkeyed. A repeated key with the same method, path and body returns the
        stored answer with Idempotency-Replayed: true: a 2xx, or a final refusal
        (bad-request, idempotency-key-invalid, robot-not-found, asrs-not-found,
        unknown-port, wrong-port-kind, invalid-position, unknown-fault-kind). A
        retryable refusal (port-occupied, position-occupied, asrs-rejected,
        command-not-applied) is not stored and its key is released, so the retry
        executes again. With a different method, path or body under a stored
        answer it is 409 idempotency-key-reused. A 5xx is never stored. A
        malformed key is 400 idempotency-key-invalid. Answers are kept 24 hours
        in process memory and are lost on a restart (single replica).
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[!-~]([ -~]*[!-~])?$'
    Limit:
      name: limit
      in: query
      required: false
      description: Page size, 1-500 (default 100). Out of range, empty or repeated is 400 invalid-limit.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    Cursor:
      name: cursor
      in: query
      required: false
      description: >-
        Opaque keyset cursor taken from the previous page's nextCursor; an
        undecodable or repeated cursor is 400 invalid-cursor.
      schema:
        type: string
    AsrsId:
      name: asrsId
      in: path
      required: true
      description: The AS/RS identifier.
      schema: { type: string }
  responses:
    BadRequest:
      description: >-
        The request body is malformed or a required field is missing
        (bad-request), the Idempotency-Key is malformed (idempotency-key-invalid),
        or a paging parameter is wrong (unknown-query-parameter, invalid-limit,
        invalid-cursor).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The robot or AS/RS is unknown (robot-not-found, asrs-not-found).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: >-
        The AS/RS rejected the command; `detail` carries the reject reason, for
        example PORT_OCCUPIED, and `code` its slug (port-occupied). Also 409
        idempotency-key-reused: the Idempotency-Key was used with a different
        method, path or body.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unprocessable:
      description: >-
        The request is well formed but cannot be applied: unknown-fault-kind, or
        command-not-applied (publishing the result to the MQTT broker failed;
        retry).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: Not ready; the MQTT broker is not connected.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Fault:
      type: object
      required: [kind, target, active]
      properties:
        kind:
          type: string
          enum: [ROBOT_BLOCKED, ROBOT_BATTERY, ROBOT_DISCONNECT, ASRS_UNIT, ASRS_NO_READ]
        target: { type: string, description: Robot serial number or AS/RS id. }
        aisle: { type: integer, description: Aisle for ASRS_UNIT. }
        port: { type: string, description: Port id for ASRS_NO_READ. }
        active: { type: boolean }
        value: { type: number, description: State of charge for ROBOT_BATTERY. }
    Position:
      type: object
      required: [aisle, level, slot, depth]
      properties:
        aisle: { type: integer }
        level: { type: integer }
        slot: { type: integer }
        depth: { type: integer }
    Seed:
      type: object
      required: [position, containerId]
      properties:
        position:
          $ref: "#/components/schemas/Position"
        containerId: { type: string }
    PortContainer:
      type: object
      required: [containerId]
      properties:
        containerId: { type: string }
    RobotPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Robot"
        nextCursor:
          type: string
          description: Opaque cursor of the next page; absent on the last page.
    Robot:
      type: object
      required: [serialNumber, orderId, lastNodeId, x, y, driving, stateOfCharge, charging, errors]
      properties:
        serialNumber: { type: string }
        orderId: { type: string }
        lastNodeId: { type: string }
        x: { type: number }
        y: { type: number }
        driving: { type: boolean }
        stateOfCharge: { type: number }
        charging: { type: boolean }
        loadId: { type: string }
        errors:
          type: array
          items: { type: string }
    UnitView:
      type: object
      required: [id, state, currentJob, queued]
      properties:
        id: { type: string }
        state: { type: string, enum: [IDLE, EXECUTE, HELD] }
        currentJob: { type: string }
        queued: { type: integer }
    AsrsView:
      type: object
      required: [id, slots, ports, units]
      properties:
        id: { type: string }
        slots:
          type: object
          description: Storage position (for example A1-L1-S1-D1) to container id.
          additionalProperties: { type: string }
        ports:
          type: object
          description: Port id to container id; an empty string means the port is empty.
          additionalProperties: { type: string }
        units:
          type: array
          items:
            $ref: "#/components/schemas/UnitView"
    Problem:
      type: object
      description: RFC 7807 problem document used for every non-2xx response.
      required: [type, title, status, detail, code]
      properties:
        type: { type: string, example: "about:blank" }
        title: { type: string }
        status: { type: integer, format: int32 }
        detail: { type: string }
        code:
          type: string
          description: The stable problem slug (for example port-occupied); its replay class is listed in ADR 0006.
          example: port-occupied
