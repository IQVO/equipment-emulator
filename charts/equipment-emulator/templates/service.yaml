apiVersion: v1
kind: Service
metadata:
  name: {{ include "equipment-emulator.fullname" . }}
  labels:
    {{- include "equipment-emulator.labels" . | nindent 4 }}
    app.kubernetes.io/component: emulator
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "equipment-emulator.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: emulator
